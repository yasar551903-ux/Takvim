<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Ekonomik Takvim</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TradingView Widget Başlangıcı -->
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
            {
              "colorTheme": "dark",
              "isTransparent": false,
              "locale": "tr",
              "countryFilter": "us,tr,eu,cn,ru",
              "importanceFilter": "0,1",
              "width": "100%",
              "height": 600
            }
            </script>
        </div>
        <!-- TradingView Widget Sonu -->
    </div>
</body>
</html>
